name: Update NHL Player Stats

on:
  schedule:
    # Runs every hour to catch newly finished NHL matches
    - cron: '15 * * * *'
  workflow_dispatch: # Adds a manual "Run workflow" button in GitHub Actions

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest official NHL career stats
        run: python fetch_nhl.py

      - name: Commit and push updated players.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add players.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NHL player stats" && git push)
